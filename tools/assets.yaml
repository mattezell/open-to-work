    saturation: 1.0
    prompt: >
      {strip4} The attached image is the approved character model sheet: match
      this exact character. {matt}
      Animation: JUMP AND FLYING KICK, all in mid-air except frame 1. Frame 1
      crouched take-off, knees deeply bent. Frame 2 rising, knees tucked up,
