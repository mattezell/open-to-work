# ---------------------------------------------------------------------------
# OPEN TO WORK asset manifest
#
# Every generated asset in the game is declared here, so the art direction is a
# reviewable file rather than a chat history. tools/genassets.py reads this,
# drives codex's image_gen tool, and post-processes through tools/pixelize.py.
#
#   python3 tools/genassets.py --list
#   python3 tools/genassets.py --group design --jobs 3
#   python3 tools/genassets.py --only matt_design_a --dry-run
#
# Flow: `design` candidates first (full resolution, cutout only). The approved
# design is copied to art/ref/ and listed under `refs` for every animation
# sheet of that character, together with the verbatim description below.
# ---------------------------------------------------------------------------

style:
  # Prepended to every prompt. This paragraph is the whole look of the game.
  world: >
    OPEN TO WORK house style: a 1992 Sega Genesis side-scrolling beat 'em up in
    the tradition of Streets of Rage 2 and Final Fight. Bold, chunky,
    confident character art with slightly exaggerated brawler proportions,
    big hands, readable faces, and a thick dark outline. Limited 16-bit
    console colour: each character uses about fifteen flat colours with two
    or three shade steps per material, lit from the upper left. The tone is
    comic and warm, a Saturday-morning cartoon punch-up, never grim. No text,
    no letters, no logos, no watermark, no signature.

  # Appended to prompts for anything that becomes a pixel actor.
  sprite: >
    Rendered as high-craft 16-bit pixel art: hard-edged colour clusters,
    minimal dithering, clean readable silhouette, no soft anti-aliased blur,
    no drop shadow, no glow, no ground plane, no scenery, no labels, no frame
    borders, no poster composition. Production game asset, not concept art.
    Fully transparent background.

  painted: >
    Painted 16-bit era key art, bold shapes, saturated but limited colour.

  # Player 1. Pasted verbatim into every Matt prompt; paraphrase drifts.
  matt: >
    MATT, player one: a stocky, broad-shouldered man in his forties with a
    closely buzzed, nearly bald head and a full, thick brown beard that is
    greying at the cheeks and sides, trimmed short at the chin. Grey-green
    eyes under heavy brows, a determined half-smile. He wears a plain
    heathered brick-red crew-neck t-shirt, dark blue straight-leg jeans, and
    black-and-white sneakers. A black smartwatch on his left wrist. Big
    capable hands, forearms slightly thick. He reads clearly as one
    recognisable person: same face, same beard, same proportions, same
    palette, every time.

  # Player 2, the AI sidekick. Original design; not any existing robot.
  token: >
    TOKEN, the AI sidekick robot: about the height of a man's chest. Its head
    is a chunky beige 1980s CRT computer monitor with rounded bezel corners;
    the screen is dark teal and shows a simple glowing pixel face, two square
    eyes and a small line mouth. A short thin antenna on top ends in a round
    amber bulb. Boxy cream-coloured torso with teal panel seams and a small
    row of three coloured status lights on the chest. Segmented grey
    ball-jointed arms ending in oversized grey boxing-glove fists. Short
    stubby legs with wide flat grey feet. Friendly, eager, slightly clumsy.
    Same proportions, same palette, same silhouette, every time.

  # Enemy 1. The ATS Bot: the machine that reads your resume and says no.
  ats: >
    ATS BOT, an enemy robot built out of an office paper shredder: a squat
    boxy grey-and-navy shredder body on two short hydraulic legs, the wide
    black shredder slot on its front acting as a jagged grinning mouth with
    strips of paper hanging out of it. A single red scanner-bar eye sweeps
    across a dark visor above the slot. Two thin claw arms with grabber
    pincers. A small blinking red light on top. Menacing but funny, clearly a
    machine, no text on it. Same proportions, same palette, same silhouette,
    every time.

  # Enemy 2. The Spam Recruiter: fast, pushy, throws business cards.
  spam: >
    SPAM RECRUITER, an enemy: a wiry, fast-moving humanoid made entirely of
    junk mail. Its torso is a bulging, overstuffed envelope; its head is a
    folded letter with a huge toothy salesman grin and two round, over-eager
    eyes; a clip-on headset microphone curls to its mouth. A bright magenta
    tie, thin legs in grey pinstripe trousers, pointed shiny shoes. Arms
    like rolled-up flyers, one hand clutching a fan of blank business cards
    ready to throw. Pushy and cheerful, clearly a paper creature and not a
    human. Blank paper, no text. Same proportions, same palette, same
    silhouette, every time.

  # Stage 1 mini-boss. The Unpaid Take Home: the "four hour" assignment.
  takehome: >
    THE UNPAID TAKE HOME, a mini-boss: a hulking, top-heavy golem made of
    an overstuffed manila file folder and towering stacks of printer paper,
    twice the bulk of a man. A large brass stopwatch is embedded in its
    chest. Its head is a spiral-bound notebook with two angry glowing yellow
    eyes peering from under the cover. Huge fists made of crumpled paper
    wads bound with giant black binder clips; paper clips as shoulder
    armour. Loose pages flutter off it. Menacing but funny, blank pages,
    no text. Same proportions, same palette, same silhouette, every time.

  # Stage 3 enemy. The LeetCode Golem: the whiteboard puzzle, armoured.
  golem: >
    LEETCODE GOLEM, an armoured enemy: a hulking, slow stone golem assembled
    from grey granite blocks and old mechanical keyboard keys, taller and
    broader than a man. A cracked whiteboard is set into its chest like a
    breastplate, scrawled with blank boxes and arrows of a tree diagram. Its
    head is a small square block with two glowing green terminal-cursor
    eyes. Massive boulder fists studded with loose keycaps. Heavy, patient,
    immovable. Blank keycaps, no letters, no text. Same proportions, same
    palette, same silhouette, every time.

  # Stage 3 enemy. The Ghosting Phantom: there one moment, gone the next.
  phantom: >
    GHOSTING PHANTOM, an enemy: a pale lavender, semi-transparent ghost in a
    smart navy business blazer with a lanyard and a blank ID badge. Instead
    of a head it has a floating smartphone whose dark screen shows two
    hollow white eyes and no mouth. Below the blazer there are no legs,
    only a wispy trailing ghost tail. Long thin arms with pale ghostly
    hands. Eerie but funny. Blank badge, blank screen apart from the eyes,
    no text. Same proportions, same palette, same silhouette, every time.

  # The Panel, Stage 3 boss: three interviewers, each at their own desk.
  screener: >
    THE SCREENER, an interviewer on the boss panel: a figure seated at a
    small pale-wood office desk, seen from the side. Its head is a big brown
    clipboard with a sheet of paper clipped to it, on which is drawn a
    wide, fixed, too-friendly marker smile and two dot eyes. Coral pink
    cardigan over a white blouse, a tall stack of blank forms on the desk
    beside a desk bell. Relentlessly cheerful. Blank forms, no text. Same
    proportions, same palette, same silhouette, every time.
  techlead: >
    THE TECH LEAD, an interviewer on the boss panel: a figure seated at a
    small dark-wood office desk, seen from the side. Its head is a small
    square whiteboard on a stand-like neck, with two narrowed eyes and a
    flat unimpressed mouth drawn in blue dry-erase marker. Grey zip-up
    hoodie, a laptop open on the desk, a mug of dry-erase markers.
    Sceptical and nitpicky. Blank laptop screen, no text. Same proportions,
    same palette, same silhouette, every time.
  manager: >
    THE HIRING MANAGER, an interviewer on the boss panel: a figure seated at
    a small mahogany office desk, seen from the side. Its head is a large
    white coffee mug with steam curling off the top and a calm, unreadable
    face printed on the side, two dot eyes and a small straight mouth. Navy
    blazer over a light blue shirt, hands steepled on the desk next to a
    closed manila folder and a fountain pen. The final decision. Blank
    folder, no text. Same proportions, same palette, same silhouette, every
    time.

  strip2: >
    A single horizontal sprite strip of exactly 2 animation frames in 2 equal
    side-by-side slots, evenly spaced with clear empty space between them,
    all the same scale, all facing RIGHT in strict side profile.
  strip4: >
    A single horizontal sprite strip of exactly 4 animation frames in 4 equal
    side-by-side slots, evenly spaced with clear empty space between them,
    all the same scale, all facing RIGHT in strict side profile.
  strip6: >
    A single horizontal sprite strip of exactly 6 animation frames in 6 equal
    side-by-side slots, evenly spaced with clear empty space between them,
    all the same scale, all facing RIGHT in strict side profile.

assets:
  # --- design candidates: pick one per character, then it becomes the ref --

  - id: matt_design_a
    group: design
    kind: design
    size: "1536x1024"
    out: art/designs/matt_a.png
    refs: [ref/matt-1.jpg, ref/matt-2.jpg]
    prompt: >
      Character model sheet for a video game hero, drawn from the attached
      reference photos of the real person: match his face, head shape, beard
      shape and colour, eye colour and build closely. {matt}
      Two full-body views of the same character side by side, same scale,
      separated by clear empty space: on the left, standing facing the
      viewer in a relaxed ready pose; on the right, in strict side profile
      facing RIGHT in a boxer's fighting stance, fists up. Faithful, grounded
      proportions.

  - id: matt_design_b
    group: design
    kind: design
    size: "1536x1024"
    out: art/designs/matt_b.png
    refs: [ref/matt-1.jpg, ref/matt-2.jpg]
    prompt: >
      Character model sheet for a video game hero, drawn from the attached
      reference photos of the real person: match his face, head shape, beard
      shape and colour, eye colour and build closely. {matt}
      Two full-body views of the same character side by side, same scale,
      separated by clear empty space: on the left, facing the viewer with
      arms crossed and a confident grin; on the right, in strict side profile
      facing RIGHT in a boxer's fighting stance, fists up. Heroic arcade
      brawler proportions: broader chest, bigger fists, slightly larger head,
      like a Streets of Rage 2 lead.

  - id: matt_design_c
    group: design
    kind: design
    size: "1536x1024"
    out: art/designs/matt_c.png
    refs: [ref/matt-1.jpg, ref/matt-2.jpg]
    prompt: >
      Character model sheet for a video game hero, drawn from the attached
      reference photos of the real person: match his face, head shape, beard
      shape and colour, eye colour and build closely. {matt}
      Additionally he wears a pair of over-ear headphones resting around his
      neck and the t-shirt sleeves are pushed up. Two full-body views of the
      same character side by side, same scale, separated by clear empty
      space: on the left, facing the viewer, cracking his knuckles; on the
      right, in strict side profile facing RIGHT in a boxer's fighting
      stance, fists up. Slightly chibi-leaning arcade proportions, like a
      Final Fight hero seen through a cartoon lens.

  - id: token_design_a
    group: design
    kind: design
    size: "1536x1024"
    out: art/designs/token_a.png
    prompt: >
      Character model sheet for a video game sidekick robot. {token}
      Two full-body views of the same robot side by side, same scale,
      separated by clear empty space: on the left, facing the viewer and
      waving one fist; on the right, in strict side profile facing RIGHT in
      a fighting stance, fists up, screen face showing determined eyes.

  - id: token_design_b
    group: design
    kind: design
    size: "1536x1024"
    out: art/designs/token_b.png
    prompt: >
      Character model sheet for a video game sidekick robot. {token}
      Rounder, toylike take: softer bevels, a slightly bigger monitor head
      relative to the body, like a 1980s tin toy. Two full-body views of the
      same robot side by side, same scale, separated by clear empty space:
      on the left, facing the viewer with a happy screen face; on the right,
      in strict side profile facing RIGHT in a fighting stance, fists up.

  # --- enemies: design first, same flow ------------------------------------

  - id: ats_design
    group: enemy-design
    kind: design
    size: "1536x1024"
    out: art/designs/ats.png
    prompt: >
      Character model sheet for a video game enemy. {ats}
      Two full-body views of the same robot side by side, same scale,
      separated by clear empty space: on the left, facing the viewer; on the
      right, in strict side profile facing LEFT, lurching forward with its
      shredder mouth open.

  - id: spam_design
    group: enemy-design
    kind: design
    size: "1536x1024"
    out: art/designs/spam.png
    prompt: >
      Character model sheet for a video game enemy. {spam}
      Two full-body views of the same character side by side, same scale,
      separated by clear empty space: on the left, facing the viewer with a
      salesman's double thumbs-up; on the right, in strict side profile
      facing LEFT, winding up to flick a business card.

  - id: takehome_design
    group: enemy-design
    kind: design
    size: "1536x1024"
    out: art/designs/takehome.png
    prompt: >
      Character model sheet for a video game mini-boss. {takehome}
      Two full-body views of the same golem side by side, same scale,
      separated by clear empty space: on the left, facing the viewer, fists
      raised; on the right, in strict side profile facing LEFT, stomping
      forward.

  # --- Matt animation sheets -----------------------------------------------
  # Every frame 128x96, body pinned to 80 px tall, feet on the bottom edge.
  # The approved design sheet is attached as a reference to every one.

  - id: matt_idle
    group: matt
    kind: strip
    size: "1536x1024"
    out: public/sprites/matt/idle.png
    refs: [art/ref/matt.png]
    frames: 4
    frame_width: 128
    frame_height: 96
    target_height: 80
    outline: "101010"
    saturation: 1.0
    prompt: >
      {strip4} The attached image is the approved character model sheet: match
      this exact character. {matt}
      Animation: FIGHTING STANCE IDLE LOOP, fists up in a boxer's guard, knees
      bent. Frame 1 neutral. Frame 2 shoulders dip slightly as he breathes out.
      Frame 3 lowest point. Frame 4 rising back toward frame 1. The feet do not
      move. Subtle motion.

  - id: matt_walk
    group: matt
    kind: strip
    size: "1536x1024"
    out: public/sprites/matt/walk.png
