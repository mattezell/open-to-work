# ---------------------------------------------------------------------------
# OPEN TO WORK asset manifest
#
# Every generated asset in the game is declared here, so the art direction is a
# reviewable file rather than a chat history. tools/genassets.py reads this,
# drives codex's image_gen tool, and post-processes through tools/pixelize.py.
#
#   python3 tools/genassets.py --list
#   python3 tools/genassets.py --group design --jobs 3
#   python3 tools/genassets.py --only matt_design_a --dry-run
#
# Flow: `design` candidates first (full resolution, cutout only). The approved
# design is copied to art/ref/ and listed under `refs` for every animation
# sheet of that character, together with the verbatim description below.
# ---------------------------------------------------------------------------

style:
  # Prepended to every prompt. This paragraph is the whole look of the game.
  world: >
    OPEN TO WORK house style: a 1992 Sega Genesis side-scrolling beat 'em up in
    the tradition of Streets of Rage 2 and Final Fight. Bold, chunky,
    confident character art with slightly exaggerated brawler proportions,
    big hands, readable faces, and a thick dark outline. Limited 16-bit
    console colour: each character uses about fifteen flat colours with two
    or three shade steps per material, lit from the upper left. The tone is
    comic and warm, a Saturday-morning cartoon punch-up, never grim. No text,
    no letters, no logos, no watermark, no signature.

  # Appended to prompts for anything that becomes a pixel actor.
  sprite: >
    Rendered as high-craft 16-bit pixel art: hard-edged colour clusters,
    minimal dithering, clean readable silhouette, no soft anti-aliased blur,
    no drop shadow, no glow, no ground plane, no scenery, no labels, no frame
    borders, no poster composition. Production game asset, not concept art.
    Fully transparent background.

  painted: >
    Painted 16-bit era key art, bold shapes, saturated but limited colour.

  # Player 1. Pasted verbatim into every Matt prompt; paraphrase drifts.
  matt: >
    MATT, player one: a stocky, broad-shouldered man in his forties with a
    closely buzzed, nearly bald head and a full, thick brown beard that is
    greying at the cheeks and sides, trimmed short at the chin. Grey-green
    eyes under heavy brows, a determined half-smile. He wears a plain
    heathered brick-red crew-neck t-shirt, dark blue straight-leg jeans, and
    black-and-white sneakers. A black smartwatch on his left wrist. Big
    capable hands, forearms slightly thick. He reads clearly as one
    recognisable person: same face, same beard, same proportions, same
    palette, every time.

  # Player 2, the AI sidekick. Original design; not any existing robot.
  token: >
    TOKEN, the AI sidekick robot: about the height of a man's chest. Its head
    is a chunky beige 1980s CRT computer monitor with rounded bezel corners;
    the screen is dark teal and shows a simple glowing pixel face, two square
    eyes and a small line mouth. A short thin antenna on top ends in a round
    amber bulb. Boxy cream-coloured torso with teal panel seams and a small
    row of three coloured status lights on the chest. Segmented grey
    ball-jointed arms ending in oversized grey boxing-glove fists. Short
    stubby legs with wide flat grey feet. Friendly, eager, slightly clumsy.
    Same proportions, same palette, same silhouette, every time.

  # Enemy 1. The ATS Bot: the machine that reads your resume and says no.
  ats: >
    ATS BOT, an enemy robot built out of an office paper shredder: a squat
    boxy grey-and-navy shredder body on two short hydraulic legs, the wide
    black shredder slot on its front acting as a jagged grinning mouth with
    strips of paper hanging out of it. A single red scanner-bar eye sweeps
    across a dark visor above the slot. Two thin claw arms with grabber
    pincers. A small blinking red light on top. Menacing but funny, clearly a
    machine, no text on it. Same proportions, same palette, same silhouette,
    every time.

  strip2: >
    A single horizontal sprite strip of exactly 2 animation frames in 2 equal
    side-by-side slots, evenly spaced with clear empty space between them,
    all the same scale, all facing RIGHT in strict side profile.
  strip4: >
    A single horizontal sprite strip of exactly 4 animation frames in 4 equal
    side-by-side slots, evenly spaced with clear empty space between them,
    all the same scale, all facing RIGHT in strict side profile.
  strip6: >
    A single horizontal sprite strip of exactly 6 animation frames in 6 equal
    side-by-side slots, evenly spaced with clear empty space between them,
    all the same scale, all facing RIGHT in strict side profile.

assets:
  # --- design candidates: pick one per character, then it becomes the ref --

  - id: matt_design_a
    group: design
    kind: design
    size: "1536x1024"
    out: art/designs/matt_a.png
    refs: [ref/matt-1.jpg, ref/matt-2.jpg]
    prompt: >
      Character model sheet for a video game hero, drawn from the attached
      reference photos of the real person: match his face, head shape, beard
      shape and colour, eye colour and build closely. {matt}
      Two full-body views of the same character side by side, same scale,
      separated by clear empty space: on the left, standing facing the
      viewer in a relaxed ready pose; on the right, in strict side profile
      facing RIGHT in a boxer's fighting stance, fists up. Faithful, grounded
      proportions.

  - id: matt_design_b
    group: design
    kind: design
    size: "1536x1024"
    out: art/designs/matt_b.png
    refs: [ref/matt-1.jpg, ref/matt-2.jpg]
    prompt: >
      Character model sheet for a video game hero, drawn from the attached
      reference photos of the real person: match his face, head shape, beard
      shape and colour, eye colour and build closely. {matt}
      Two full-body views of the same character side by side, same scale,
      separated by clear empty space: on the left, facing the viewer with
      arms crossed and a confident grin; on the right, in strict side profile
      facing RIGHT in a boxer's fighting stance, fists up. Heroic arcade
      brawler proportions: broader chest, bigger fists, slightly larger head,
      like a Streets of Rage 2 lead.

  - id: matt_design_c
    group: design
    kind: design
    size: "1536x1024"
    out: art/designs/matt_c.png
    refs: [ref/matt-1.jpg, ref/matt-2.jpg]
    prompt: >
      Character model sheet for a video game hero, drawn from the attached
      reference photos of the real person: match his face, head shape, beard
      shape and colour, eye colour and build closely. {matt}
      Additionally he wears a pair of over-ear headphones resting around his
      neck and the t-shirt sleeves are pushed up. Two full-body views of the
      same character side by side, same scale, separated by clear empty
      space: on the left, facing the viewer, cracking his knuckles; on the
      right, in strict side profile facing RIGHT in a boxer's fighting
      stance, fists up. Slightly chibi-leaning arcade proportions, like a
      Final Fight hero seen through a cartoon lens.

  - id: token_design_a
    group: design
    kind: design
    size: "1536x1024"
    out: art/designs/token_a.png
    prompt: >
      Character model sheet for a video game sidekick robot. {token}
      Two full-body views of the same robot side by side, same scale,
      separated by clear empty space: on the left, facing the viewer and
      waving one fist; on the right, in strict side profile facing RIGHT in
      a fighting stance, fists up, screen face showing determined eyes.

  - id: token_design_b
    group: design
    kind: design
    size: "1536x1024"
    out: art/designs/token_b.png
    prompt: >
      Character model sheet for a video game sidekick robot. {token}
      Rounder, toylike take: softer bevels, a slightly bigger monitor head
      relative to the body, like a 1980s tin toy. Two full-body views of the
      same robot side by side, same scale, separated by clear empty space:
      on the left, facing the viewer with a happy screen face; on the right,
      in strict side profile facing RIGHT in a fighting stance, fists up.

  # --- enemies: design first, same flow ------------------------------------

  - id: ats_design
    group: enemy-design
    kind: design
    size: "1536x1024"
    out: art/designs/ats.png
    prompt: >
      Character model sheet for a video game enemy. {ats}
      Two full-body views of the same robot side by side, same scale,
      separated by clear empty space: on the left, facing the viewer; on the
      right, in strict side profile facing LEFT, lurching forward with its
      shredder mouth open.

  # --- Matt animation sheets -----------------------------------------------
  # Every frame 128x96, body pinned to 80 px tall, feet on the bottom edge.
  # The approved design sheet is attached as a reference to every one.

  - id: matt_idle
    group: matt
    kind: strip
    size: "1536x1024"
    out: public/sprites/matt/idle.png
    refs: [art/ref/matt.png]
    frames: 4
    frame_width: 128
    frame_height: 96
    target_height: 80
    outline: "101010"
    saturation: 1.0
    prompt: >
      {strip4} The attached image is the approved character model sheet: match
      this exact character. {matt}
      Animation: FIGHTING STANCE IDLE LOOP, fists up in a boxer's guard, knees
      bent. Frame 1 neutral. Frame 2 shoulders dip slightly as he breathes out.
      Frame 3 lowest point. Frame 4 rising back toward frame 1. The feet do not
      move. Subtle motion.

  - id: matt_walk
    group: matt
    kind: strip
    size: "1536x1024"
    out: public/sprites/matt/walk.png
    refs: [art/ref/matt.png]
    frames: 6
    frame_width: 128
    frame_height: 96
    target_height: 80
    outline: "101010"
    saturation: 1.0
    prompt: >
      {strip6} The attached image is the approved character model sheet: match
      this exact character. {matt}
      Animation: WALK CYCLE, a confident brawler's swagger with fists held low
      and ready. Six evenly spaced phases of one complete stride: contact,
      down, passing, contact with the other foot, down, passing.

  - id: matt_jab
    group: matt
    kind: strip
    size: "1536x1024"
    out: public/sprites/matt/jab.png
    refs: [art/ref/matt.png]
    frames: 4
    frame_width: 128
    frame_height: 96
    target_height: 80
    outline: "101010"
    saturation: 1.0
    prompt: >
      {strip4} The attached image is the approved character model sheet: match
      this exact character. {matt}
      Animation: TWO QUICK JABS. Frame 1 guard, weight shifting forward.
      Frame 2 lead fist fully extended straight forward at head height.
      Frame 3 back in guard. Frame 4 rear fist fully extended straight forward
      at head height. Short, snappy, no wind-up.

  - id: matt_haymaker
    group: matt
    kind: strip
    size: "1536x1024"
    out: public/sprites/matt/haymaker.png
    refs: [art/ref/matt.png]
    frames: 4
    frame_width: 128
    frame_height: 96
    target_height: 80
    outline: "101010"
    saturation: 1.0
    prompt: >
      {strip4} The attached image is the approved character model sheet: match
      this exact character. {matt}
      Animation: HAYMAKER FINISHER. Frame 1 big wind-up, rear fist drawn far
      back, torso twisted away. Frame 2 fist swinging forward in a wide arc.
      Frame 3 full follow-through, arm fully extended forward and slightly
      upward, whole body committed, front foot planted. Frame 4 recovering,
      fist coming back to guard.

  - id: matt_jump
    group: matt
    kind: strip
    size: "1536x1024"
    out: public/sprites/matt/jump.png
    refs: [art/ref/matt.png]
    frames: 4
    frame_width: 128
    frame_height: 96
    target_height: 78
    outline: "101010"
    saturation: 1.0
    prompt: >
      {strip4} The attached image is the approved character model sheet: match
      this exact character. {matt}
      Animation: JUMP AND FLYING KICK, all in mid-air except frame 1. Frame 1
      crouched take-off, knees deeply bent. Frame 2 rising, knees tucked up,
      fists up. Frame 3 falling, legs extending down. Frame 4 FLYING KICK:
      body leaning back, lead leg shot straight forward horizontally, sole of
      the sneaker first.

  - id: matt_hurt
    group: matt
    kind: strip
    size: "1536x1024"
    out: public/sprites/matt/hurt.png
    refs: [art/ref/matt.png]
    frames: 2
    frame_width: 128
    frame_height: 96
    target_height: 78
    outline: "101010"
    saturation: 1.0
    prompt: >
      {strip2} The attached image is the approved character model sheet: match
      this exact character. {matt}
      Animation: TAKING A HIT. Frame 1 head snapped back, eyes squeezed shut,
      one foot stepping back, arms flung loose. Frame 2 hunched forward,
      wincing, one hand on his stomach.

  - id: matt_knockdown
    group: matt
    kind: strip
    size: "1536x1024"
    out: public/sprites/matt/knockdown.png
    refs: [art/ref/matt.png]
    frames: 4
    frame_width: 128
    frame_height: 96
    target_height: 76
    outline: "101010"
    saturation: 1.0
    prompt: >
      {strip4} The attached image is the approved character model sheet: match
      this exact character. {matt}
      Animation: KNOCKED DOWN AND GETTING UP. Frame 1 blasted backwards off
      his feet, body arched, arms flung forward. Frame 2 flat on his back on
      the ground, fully horizontal, head toward the LEFT. Frame 3 pushing up
      onto one knee, one hand on the ground. Frame 4 almost standing, shaking
      it off.

  - id: matt_special
    group: matt
    kind: strip
    size: "1536x1024"
    out: public/sprites/matt/special.png
    refs: [art/ref/matt.png]
    frames: 4
    frame_width: 128
    frame_height: 96
    target_height: 80
    outline: "101010"
    saturation: 1.0
    prompt: >
      {strip4} The attached image is the approved character model sheet: match
      this exact character. {matt}
      Animation: SPINNING BACKFIST SPECIAL, a 360 degree spin with both arms
      flung out wide. Frame 1 facing right, arms out. Frame 2 back turned to
      the viewer mid-spin. Frame 3 facing left, arms out. Frame 4 facing the
      viewer, completing the spin. Motion is fast and dramatic.

  # --- TOKEN animation sheets ----------------------------------------------
  # Every frame 112x80, body pinned to 64 px tall.

  - id: token_idle
    group: token
    kind: strip
    size: "1536x1024"
    out: public/sprites/token/idle.png
    refs: [art/ref/token.png]
    frames: 4
    frame_width: 112
    frame_height: 80
    target_height: 64
    outline: "101010"
    prompt: >
      {strip4} The attached image is the approved character model sheet: match
      this exact robot. {token}
      Animation: FIGHTING STANCE IDLE LOOP, fists up, bobbing eagerly. Frame 1
      neutral. Frame 2 slight bounce down. Frame 3 lowest, antenna bulb
      swaying. Frame 4 back up. The feet do not move.

  - id: token_walk
    group: token
    kind: strip
    size: "1536x1024"
    out: public/sprites/token/walk.png
    refs: [art/ref/token.png]
    frames: 6
    frame_width: 112
    frame_height: 80
    target_height: 64
    outline: "101010"
    prompt: >
      {strip6} The attached image is the approved character model sheet: match
      this exact robot. {token}
      Animation: WALK CYCLE, a bouncy stompy robot march with fists pumping.
      Six evenly spaced phases of one complete stride.

  - id: token_punch
    group: token
    kind: strip
    size: "1536x1024"
    out: public/sprites/token/punch.png
    refs: [art/ref/token.png]
    frames: 4
    frame_width: 112
    frame_height: 80
    target_height: 64
    outline: "101010"
    prompt: >
      {strip4} The attached image is the approved character model sheet: match
      this exact robot. {token}
      Animation: ONE-TWO PUNCH. Frame 1 wind-up. Frame 2 lead fist fully
      extended forward, arm segments telescoped out. Frame 3 back to guard.
      Frame 4 other fist fully extended forward. The screen face shows
      fierce eyes throughout.

  - id: token_hurt
    group: token
    kind: strip
    size: "1536x1024"
    out: public/sprites/token/hurt.png
    refs: [art/ref/token.png]
    frames: 2
    frame_width: 112
    frame_height: 80
    target_height: 62
    outline: "101010"
    prompt: >
      {strip2} The attached image is the approved character model sheet: match
      this exact robot. {token}
      Animation: TAKING A HIT. Frame 1 monitor head knocked back, screen face
      showing X eyes. Frame 2 wobbling forward, screen showing static noise.

  - id: token_knockdown
    group: token
    kind: strip
    size: "1536x1024"
    out: public/sprites/token/knockdown.png
    refs: [art/ref/token.png]
    frames: 4
    frame_width: 112
    frame_height: 80
    target_height: 60
    outline: "101010"
    prompt: >
      {strip4} The attached image is the approved character model sheet: match
      this exact robot. {token}
      Animation: KNOCKED DOWN AND REBOOTING. Frame 1 blasted backwards off its
      feet. Frame 2 flat on its back, fully horizontal, head toward the LEFT,
      screen dark. Frame 3 sitting up, screen showing a small loading bar.
      Frame 4 standing back up, screen face smiling.

  # --- ATS BOT animation sheets ---------------------------------------------
  # Every frame 112x80, body pinned to 60 px tall. Ref is the approved design.

  - id: ats_idle
    group: ats
    kind: strip
    size: "1536x1024"
    out: public/sprites/ats/idle.png
    refs: [art/designs/ats.png]
    frames: 4
    frame_width: 112
    frame_height: 80
    target_height: 60
    outline: "101010"
    prompt: >
      {strip4} The attached image is the approved character model sheet: match
      this exact robot (use the side-profile view, but facing RIGHT). {ats}
      Animation: IDLE LOOP, hunched and humming. Frame 1 neutral. Frame 2 body dips slightly, paper strips sway. Frame 3 lowest, red scanner eye brighter. Frame 4 back up. The feet do not move.

  - id: ats_walk
    group: ats
    kind: strip
    size: "1536x1024"
    out: public/sprites/ats/walk.png
    refs: [art/designs/ats.png]
    frames: 6
    frame_width: 112
    frame_height: 80
    target_height: 60
    outline: "101010"
    prompt: >
      {strip6} The attached image is the approved character model sheet: match
      this exact robot (use the side-profile view, but facing RIGHT). {ats}
      Animation: WALK CYCLE, a heavy stomping lurch forward on the hydraulic legs, claws swinging, paper strips flapping. Frames alternate legs like a normal walk cycle; frame 1 and frame 4 are the contact poses.

  - id: ats_shred
    group: ats
    kind: strip
    size: "1536x1024"
    out: public/sprites/ats/shred.png
    refs: [art/designs/ats.png]
    frames: 4
    frame_width: 112
    frame_height: 80
    target_height: 60
    outline: "101010"
    prompt: >
      {strip4} The attached image is the approved character model sheet: match
      this exact robot (use the side-profile view, but facing RIGHT). {ats}
      Animation: ATTACK: a lunging shred grab. Frame 1 wind-up, leaning back, claws raised, scanner eye flaring red. Frame 2 lunging forward, mouth slot wide open. Frame 3 full extension, both claws snapping shut in front, paper confetti bursting from the mouth. Frame 4 recovering upright.

  - id: ats_hurt
    group: ats
    kind: strip
    size: "1536x1024"
    out: public/sprites/ats/hurt.png
    refs: [art/designs/ats.png]
    frames: 2
    frame_width: 112
    frame_height: 80
    target_height: 58
    outline: "101010"
    prompt: >
      {strip2} The attached image is the approved character model sheet: match
      this exact robot (use the side-profile view, but facing RIGHT). {ats}
      Animation: HIT REACTION. Frame 1 knocked back, body tilted away, visor glitching with the eye shown as a broken red zigzag. Frame 2 staggering, one claw limp, sparks at a seam.

  - id: ats_knockdown
    group: ats
    kind: strip
    size: "1536x1024"
    out: public/sprites/ats/knockdown.png
    refs: [art/designs/ats.png]
    frames: 4
    frame_width: 112
    frame_height: 80
    target_height: 56
    outline: "101010"
    prompt: >
      {strip4} The attached image is the approved character model sheet: match
      this exact robot (use the side-profile view, but facing RIGHT). {ats}
      Animation: KNOCKDOWN. Frame 1 blown backwards off its feet, legs kicking up. Frame 2 flat on its back on the ground, lying horizontally, paper strips spilling out. Frame 3 pushing itself up on one claw, sparking. Frame 4 upright again, wobbly, red light blinking.
