    frame_width: 128
    frame_height: 96
    target_height: 78
    outline: "101010"
    saturation: 1.0
    prompt: >
      {strip2} The attached image is the approved character model sheet: match
      this exact character. {matt}
      Animation: TAKING A HIT. Frame 1 head snapped back, eyes squeezed shut,
      one foot stepping back, arms flung loose. Frame 2 hunched forward,
      wincing, one hand on his stomach.

  - id: matt_knockdown
