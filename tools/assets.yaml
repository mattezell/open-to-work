    frames: 6
    frame_width: 128
    frame_height: 96
    target_height: 80
    outline: "101010"
    saturation: 1.0
    prompt: >
      {strip6} The attached image is the approved character model sheet: match
      this exact character. {matt}
      Animation: WALK CYCLE, a confident brawler's swagger with fists held low
      and ready. Six evenly spaced phases of one complete stride: contact,
      down, passing, contact with the other foot, down, passing.

  - id: matt_jab
