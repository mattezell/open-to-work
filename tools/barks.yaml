# TOKEN's bark bank, generated by tools/genbarks.py into src/view/barks.json.
#
# Each category is one kind of moment. `seeds` are the hand-written lines: they
# always lead the category and double as style examples in the prompt. The
# generator asks the local model for `candidates` more, drops any that fail
# the rules below, and keeps the bank at `keep` lines per category.

model: qwen3.8-27b
endpoint: http://127.0.0.1:8090/v1/chat/completions
seed: 22
temperature: 0.9
candidates: 14
keep: 8
# The speech bubble fits 40 characters of the pixel font; ask for less to leave margin.
max_chars: 40
ask_chars: 32

persona: >-
  TOKEN is a small, upbeat robot sidekick in a 16-bit co-op beat 'em up about
  a laid-off software developer fighting his way through the hiring process.
  TOKEN is an AI helper that is loyal, eager, a little overconfident, and
  sometimes confidently wrong. Its humour is deadpan tech and job-hunt humour:
  resumes, ATS filters, recruiters, take-home tests, interview loops, offer
  letters, software jargon. Short, punchy, spoken out loud in a speech bubble.

rules:
  - The enemy is the hiring process, never a real company, product or person.
  - Never name any real company, brand, website or person.
  - No profanity, no insults about appearance, age, gender or any group.
  - Upbeat or wry, never bitter or despairing.
  - Plain ASCII only. No emoji, no hashtags.

categories:
  wild:
    when: the player orders TOKEN to GO WILD (fight anything, maximum chaos)
    seeds:
      - "GOING WILD."
      - "No plan. Only vibes."
      - "Unleashing chaos mode."
  focus:
    when: the player orders TOKEN to FOCUS on the player's target
    seeds:
      - "Target locked."
      - "Focusing. Like a cover letter."
      - "On your mark."
  guard:
    when: the player orders TOKEN to GUARD the player and block attacks
    seeds:
      - "I got you."
      - "Shields up."
      - "Nobody touches the candidate."
  intercept:
    when: TOKEN jumps in front of an attack aimed at the player and takes the hit
    seeds:
      - "Not today, ATS."
      - "Blocked. Like my resume."
      - "Took that one for you."
  whiff:
    when: TOKEN swings at an enemy that already vanished (it hallucinated the target)
    seeds:
      - "...where did it go?"
      - "Hallucinated that one."
      - "Confidently wrong."
  reboot:
    when: TOKEN is knocked out and starts rebooting
    seeds:
      - "Rebooting..."
      - "Turning myself off and on."
      - "brb, updating"
  rebooted:
    when: TOKEN finishes rebooting and rejoins the fight
    seeds:
      - "Back online."
      - "Updates installed."
      - "Where were we?"
  pickup:
    when: someone grabs a cup of free office coffee that restores health
    seeds:
      - "Caffeinated. Allegedly."
      - "Hydrate. Caffeinate. Iterate."
      - "Free coffee. Great culture."
  reinforcements:
    when: a boss calls in extra enemies mid-fight (scope creep)
    seeds:
      - "Scope creep incoming!"
      - "They added requirements."
      - "Now it is a two-week project."
  ko:
    when: TOKEN knocks out an enemy (an ATS bot, a spam recruiter, a ghosting recruiter)
    seeds:
      - "Rejected."
      - "Per my last email."
      - "Moving forward with other candidates."
  shield:
    when: in the take-home tunnel, TOKEN's airbag absorbs a crash for the player
    seeds:
      - "Airbag deployed."
      - "Absorbed. Barely."
      - "That one was on me."
  crash:
    when: in the take-home tunnel, the player crashes into a hazard (a merge conflict, a failing test)
    seeds:
      - "Ouch. Noted."
      - "That will be in the feedback."
      - "Walk it off. Ride it off."
  retry:
    when: in the take-home tunnel, the player crashed too often and restarts from the last checkpoint
    seeds:
      - "Rolling back to last save."
      - "git checkout checkpoint"
      - "From the top. Again."
  checkpoint:
    when: in the take-home tunnel, the player passes a checkpoint
    seeds:
      - "Checkpoint. Progress saved."
      - "Committed. Pushed."
      - "Autosaved. You are welcome."
  ghosted:
    when: a ghosting recruiter fades out mid-fight and stops responding
    seeds:
      - "And they are gone."
      - "Left you on read."
      - "No reply. Classic."
  panel:
    when: the next interviewer on the interview panel takes the hot seat
    seeds:
      - "Next interviewer."
      - "Another round? Sure."
      - "Same questions, new face."
  finalRound:
    when: the hiring manager, the last interviewer of the final round, takes the hot seat
    seeds:
      - "Final round. You got this."
      - "Hiring manager. Be yourself."
      - "Last one. Close it out."
  hired:
    when: the player beats the hiring manager and wins the offer letter
    seeds:
      - "OFFER LETTER!"
      - "We did it. We are hired."
      - "Negotiate. Always negotiate."

# Lines read and dropped in review: off-context, flat, or one more 404 joke.
# Run `python3 tools/genbarks.py --reselect` after editing to refill the gaps.
veto:
  - "Deleting my resume now."
  - "No offer letter survives this."
  - "I've got a 401 problem."
  - "404: Dodge not found."
  - "Recruiter's email, basically."
  - "I saw a dream about a recruiter."
  - "404: enthusiasm not found."
  - "That was a 404, not a 500."
  - "Ship it. I mean, ship it."
  - "Recruiter sees you're alive."
  - "They went into SaaS mode."
  - "Your turn to guess my salary."
  - "They'll call you back."
  - "Reference check: you."
