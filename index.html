<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#101010" />
    <title>OPEN TO WORK</title>
    <meta
      name="description"
      content="A 16-bit co-op beat 'em up about the job hunt. Matt and TOKEN, his AI sidekick, fight their way through the hiring process."
    />
    <link rel="canonical" href="https://opentowork.immatt.com/" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The link preview. Crawlers need absolute URLs; tools/gencard.py builds the images. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OPEN TO WORK" />
    <meta property="og:title" content="OPEN TO WORK" />
    <meta
      property="og:description"
      content="A 16-bit co-op beat 'em up about the job hunt. Matt and TOKEN, his AI sidekick, fight their way through the hiring process."
    />
    <meta property="og:url" content="https://opentowork.immatt.com/" />
    <meta property="og:image" content="https://opentowork.immatt.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Matt holds up an offer letter on a rooftop at sunset while TOKEN, a small robot, cheers beside him."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        /* The game is 320x224, so its height is 70% of its width. */
        --portrait-game-h: 70vw;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101010;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #game {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
      canvas {
        image-rendering: pixelated;
      }

      /* Touch mode: no scrolling, zooming, selecting or long-press menus anywhere. */
      html.touch,
      html.touch body {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      html.touch #game {
        box-sizing: border-box;
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
      }
      /* Portrait phone: game on top, the pad gets the whole lower half. */
      @media (orientation: portrait) {
        html.touch #game {
          height: calc(var(--portrait-game-h) + var(--safe-top));
          padding-bottom: 0;
        }
      }

      .pad {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 12;
        pointer-events: none;
        font-family: monospace;
        font-weight: bold;
      }
      .pad.on {
        display: block;
      }
      .stick-zone {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 50%;
        height: 80%;
        pointer-events: auto;
        touch-action: none;
      }
      @media (orientation: portrait) {
        .stick-zone {
          height: calc(100% - var(--portrait-game-h) - var(--safe-top));
        }
      }
      .stick {
        position: absolute;
        /* Resting place until a thumb lands; then it jumps under the thumb. */
        left: calc(var(--safe-left) + 90px);
        top: calc(100% - var(--safe-bottom) - 110px);
        width: 116px;
        height: 116px;
        margin: -58px 0 0 -58px;
        border-radius: 50%;
        border: 2px solid rgb(240 240 224 / 35%);
        background: rgb(16 16 16 / 30%);
        opacity: 0.45;
        pointer-events: none;
      }
      .stick.held {
        opacity: 1;
      }
      .knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border-radius: 50%;
        background: rgb(240 240 224 / 55%);
      }
      .tbtn {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 62px;
        height: 62px;
        border-radius: 50%;
        border: 2px solid rgb(16 16 16 / 70%);
        color: #101010;
        pointer-events: auto;
        touch-action: none;
        opacity: 0.8;
      }
      /* Landscape phones: the buttons overhang the play field, so let the fight show through. */
      @media (orientation: landscape) {
        .tbtn {
          opacity: 0.55;
        }
      }
      .tbtn.press {
        opacity: 1;
        transform: scale(0.92);
        filter: brightness(1.3);
      }
      .tbtn .letter {
        font-size: 22px;
        line-height: 1;
      }
      .tbtn .caption {
        font-size: 8px;
        letter-spacing: 0.5px;
      }
      .tbtn-attack {
        width: 76px;
        height: 76px;
        right: calc(var(--safe-right) + 78px);
        bottom: calc(var(--safe-bottom) + 18px);
        background: #e0c040;
      }
      .tbtn-jump {
        right: calc(var(--safe-right) + 12px);
        bottom: calc(var(--safe-bottom) + 72px);
        background: #60a0e0;
      }
      .tbtn-special {
        width: 54px;
        height: 54px;
        right: calc(var(--safe-right) + 92px);
        bottom: calc(var(--safe-bottom) + 110px);
        background: #e06060;
      }
      /* TOKEN's order: a pill above the buttons, out of the thumb's way. */
      .tbtn-order {
        position: absolute;
        right: calc(var(--safe-right) + 12px);
        bottom: calc(var(--safe-bottom) + 176px);
        padding: 8px 12px;
        border-radius: 16px;
        border: 2px solid rgb(16 16 16 / 70%);
        background: #60c0e0;
        color: #101010;
        font-size: 12px;
        letter-spacing: 0.5px;
        white-space: nowrap;
        pointer-events: auto;
        touch-action: none;
        opacity: 0.8;
      }
      @media (orientation: landscape) {
        .tbtn-order {
          opacity: 0.55;
        }
      }
      .tbtn-order.press {
        opacity: 1;
        filter: brightness(1.3);
      }
      /* Sound on or off: touch players have no M key. Top centre, clear of the HUD corners. */
      .sound-pill {
        display: none;
      }
      html.touch .sound-pill {
        display: block;
        position: fixed;
        z-index: 13;
        top: calc(var(--safe-top) + 6px);
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 10px;
        border-radius: 12px;
        border: 2px solid rgb(16 16 16 / 70%);
        background: #f0f0e0;
        color: #101010;
        font-family: monospace;
        font-weight: bold;
        font-size: 10px;
        opacity: 0.6;
        touch-action: none;
      }
      html.touch .sound-pill.off {
        background: #808080;
      }
      /* Pause sits just right of the SOUND pill in portrait, clear of TOKEN's bar in the corner. */
      .pause-pill {
        display: none;
      }
      html.touch .pause-pill {
        display: block;
        position: fixed;
        z-index: 13;
        top: calc(var(--safe-top) + 6px);
        left: calc(50% + 46px);
        padding: 4px 10px;
        border-radius: 12px;
        border: 2px solid rgb(16 16 16 / 70%);
        background: #f0f0e0;
        color: #101010;
        font-family: monospace;
        font-weight: bold;
        font-size: 10px;
        opacity: 0.6;
        touch-action: none;
      }
      /* FULL mirrors PAUSE on the other side of SOUND; hidden once fullscreen or where there is none. */
      .full-pill {
        display: none;
      }
      html.touch .full-pill.shown {
        display: block;
        position: fixed;
        z-index: 13;
        top: calc(var(--safe-top) + 6px);
        right: calc(50% + 46px);
        padding: 4px 10px;
        border-radius: 12px;
        border: 2px solid rgb(16 16 16 / 70%);
        background: #f0f0e0;
        color: #101010;
        font-family: monospace;
        font-weight: bold;
        font-size: 10px;
        opacity: 0.6;
        touch-action: none;
      }
      /* Landscape has side bars: keep the pills off the canvas, PAUSE atop the left bar, FULL the right. */
      @media (orientation: landscape) {
        html.touch .pause-pill {
          left: calc(var(--safe-left) + 12px);
        }
        html.touch .full-pill.shown {
          right: calc(var(--safe-right) + 12px);
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
