<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#101010" />
    <title>OPEN TO WORK</title>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        /* The game is 320x224, so its height is 70% of its width. */
        --portrait-game-h: 70vw;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101010;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #game {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
      canvas {
        image-rendering: pixelated;
      }

      /* Touch mode: no scrolling, zooming, selecting or long-press menus anywhere. */
      html.touch,
      html.touch body {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      html.touch #game {
        box-sizing: border-box;
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
      }
      /* Portrait phone: game on top, the pad gets the whole lower half. */
      @media (orientation: portrait) {
        html.touch #game {
          height: calc(var(--portrait-game-h) + var(--safe-top));
          padding-bottom: 0;
        }
      }

      .pad {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 12;
        pointer-events: none;
        font-family: monospace;
        font-weight: bold;
      }
      .pad.on {
        display: block;
      }
      .stick-zone {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 50%;
        height: 80%;
        pointer-events: auto;
        touch-action: none;
      }
      @media (orientation: portrait) {
        .stick-zone {
          height: calc(100% - var(--portrait-game-h) - var(--safe-top));
        }
      }
      .stick {
        position: absolute;
        /* Resting place until a thumb lands; then it jumps under the thumb. */
        left: calc(var(--safe-left) + 90px);
        top: calc(100% - var(--safe-bottom) - 110px);
        width: 116px;
        height: 116px;
        margin: -58px 0 0 -58px;
        border-radius: 50%;
        border: 2px solid rgb(240 240 224 / 35%);
        background: rgb(16 16 16 / 30%);
        opacity: 0.45;
        pointer-events: none;
      }
      .stick.held {
        opacity: 1;
      }
      .knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border-radius: 50%;
        background: rgb(240 240 224 / 55%);
      }
      .tbtn {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 62px;
        height: 62px;
        border-radius: 50%;
        border: 2px solid rgb(16 16 16 / 70%);
        color: #101010;
        pointer-events: auto;
        touch-action: none;
        opacity: 0.8;
      }
      /* Landscape phones: the buttons overhang the play field, so let the fight show through. */
      @media (orientation: landscape) {
        .tbtn {
          opacity: 0.55;
        }
      }
      .tbtn.press {
        opacity: 1;
        transform: scale(0.92);
        filter: brightness(1.3);
      }
      .tbtn .letter {
        font-size: 22px;
        line-height: 1;
      }
      .tbtn .caption {
        font-size: 8px;
        letter-spacing: 0.5px;
      }
      .tbtn-attack {
        width: 76px;
        height: 76px;
        right: calc(var(--safe-right) + 78px);
        bottom: calc(var(--safe-bottom) + 18px);
        background: #e0c040;
      }
      .tbtn-jump {
        right: calc(var(--safe-right) + 12px);
        bottom: calc(var(--safe-bottom) + 72px);
        background: #60a0e0;
      }
      .tbtn-special {
        width: 54px;
        height: 54px;
        right: calc(var(--safe-right) + 92px);
        bottom: calc(var(--safe-bottom) + 110px);
        background: #e06060;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
